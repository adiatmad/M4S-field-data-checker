# Active theme: calm light palette, identical for every viewer.
# To switch, copy the [theme] block from one of .streamlit/themes/*.toml over the block below
# and reload the app. Options: seagrass-light, seagrass-dark, field-sunlight.
[theme]
base = "light"
primaryColor = "#1C6B5A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF3F0"
textColor = "#17231F"
borderColor = "#CFDCD5"
linkColor = "#1C6B5A"
showWidgetBorder = true
